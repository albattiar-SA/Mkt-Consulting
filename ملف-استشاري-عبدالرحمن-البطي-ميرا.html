<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>عبدالرحمن البطي × ميرا — شريكك ومعك في كل قرار</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;500;600;700&family=Almarai:wght@300;400;700&display=swap" rel="stylesheet" />
<style>
/* ==================================================================
   هوية ميرا — متغيرات التصميم
================================================================== */
:root{
  --cream:#FAF8F5; --cream2:#F3EFE9; --ink:#14110D; --ink2:#1C1813;
  --muted:#5F5F5F; --gold:#B38A4A; --gold-soft:#CFB488;
  --line:#E8E2DA; --line-dark:rgba(207,180,136,.16);
  --display:'El Messiri','Almarai',serif; --body:'Almarai',system-ui,sans-serif;
  --shadow:0 1px 2px rgba(20,17,13,.03),0 14px 44px -18px rgba(20,17,13,.12);
  --shadow-hover:0 2px 4px rgba(20,17,13,.04),0 26px 64px -20px rgba(179,138,74,.28);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:rgba(179,138,74,.25)}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:var(--body)}

.wrap{max-width:1120px;margin-inline:auto;padding-inline:24px}
.eyebrow{font-size:.8125rem;font-weight:700;color:var(--gold)}
.eyerow{display:flex;align-items:center;gap:16px}
.eyerow .rule{height:1px;width:56px;background:linear-gradient(to left,var(--gold),transparent)}
h2.sec-title{font-family:var(--display);font-weight:600;font-size:clamp(1.9rem,4.6vw,3.1rem);line-height:1.25;margin-top:18px;position:relative;width:fit-content;padding-bottom:18px}
h2.sec-title::after{content:"";position:absolute;bottom:0;inset-inline-start:2px;height:2px;width:0;background:linear-gradient(to left,var(--gold),var(--gold-soft));transition:width 1.1s cubic-bezier(.22,1,.36,1) .3s}
.sec-head.rv.in h2.sec-title::after{width:72px}
.sec-head p.lede{margin-top:14px;color:var(--muted);font-size:1.0313rem;line-height:2;max-width:46rem}

/* أيقونات */
.ico{width:44px;height:44px;border:1px solid rgba(179,138,74,.35);display:grid;place-items:center;color:var(--gold);flex:none;transition:.45s cubic-bezier(.22,1,.36,1)}
.ico svg{width:20px;height:20px}
.dark .ico{border-color:rgba(207,180,136,.4);color:var(--gold-soft)}
article:hover .ico,.prio:hover .ico{background:var(--gold);border-color:var(--gold);color:#fff;transform:rotate(-8deg) scale(1.06)}

/* الحركة */
.rv{opacity:0;transform:translateY(30px);transition:opacity 1s cubic-bezier(.22,1,.36,1),transform 1s cubic-bezier(.22,1,.36,1)}
.rv.in{opacity:1;transform:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(179,138,74,.0)}50%{box-shadow:0 0 60px -8px rgba(179,138,74,.35)}}
@keyframes shimmer{0%{background-position:150% 0}100%{background-position:-50% 0}}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .rv{opacity:1;transform:none;transition:none}
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
}

/* شريط التقدم + التنقل */
#progress{position:fixed;top:0;right:0;height:2px;width:0;background:linear-gradient(to left,var(--gold),var(--gold-soft));z-index:80}
header#nav{position:fixed;inset-inline:0;top:0;z-index:70;background:rgba(20,17,13,.84);backdrop-filter:blur(12px);border-bottom:1px solid var(--line-dark)}
#nav .bar{max-width:1120px;margin-inline:auto;padding:0 24px;height:62px;display:flex;align-items:center;justify-content:space-between;gap:16px}
#nav .brand{display:flex;align-items:center;gap:12px;color:var(--cream)}
#nav .brand img{height:32px;width:auto}
#nav .brand span{font-size:.75rem;color:rgba(250,248,245,.55)}
#nav ul{display:flex;gap:2px;list-style:none}
#nav ul a{display:block;padding:8px 11px;font-size:.75rem;color:rgba(250,248,245,.6);transition:color .3s}
#nav ul a:hover,#nav ul a.active{color:var(--gold-soft)}
#nav .print-btn{border:1px solid var(--line-dark);background:transparent;color:var(--cream);font-size:.75rem;padding:9px 16px;cursor:pointer;transition:.3s}
#nav .print-btn:hover{border-color:var(--gold);color:var(--gold-soft)}
@media(max-width:1000px){#nav ul{display:none}}
/* وردة تدور مع التمرير */
#spinRose{position:fixed;bottom:22px;inset-inline-end:22px;z-index:60;width:52px;height:52px;display:grid;place-items:center;background:var(--ink);border:1px solid var(--line-dark);color:var(--gold-soft);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .5s,transform .3s}
#spinRose.show{opacity:1;pointer-events:auto}
#spinRose:hover{transform:scale(1.08)}
#spinRose svg{width:26px;height:26px}

.rosette{color:var(--gold)}

/* ==================== الواجهة ==================== */
#hero{min-height:100svh;background:radial-gradient(1100px 600px at 78% 14%,rgba(179,138,74,.17),transparent 62%),radial-gradient(800px 520px at 8% 92%,rgba(179,138,74,.1),transparent 60%),var(--ink);color:var(--cream);display:flex;flex-direction:column;position:relative;overflow:hidden}
#hero .bgfx{position:absolute;inset:0;pointer-events:none}
#hero .r1{position:absolute;left:3%;top:12%;opacity:.1}
#hero .r2{position:absolute;right:-4%;bottom:6%;opacity:.07}
#hero .inner{flex:1;display:flex;flex-direction:column;justify-content:center;padding-top:110px;padding-bottom:60px;position:relative}
#hero .logos{display:flex;align-items:center;gap:26px}
#hero .logos img{height:84px;width:auto}
#hero .logos img.mira{border-radius:3px}
#hero .logos .sep{width:1px;height:64px;background:linear-gradient(rgba(207,180,136,0),rgba(207,180,136,.6),rgba(207,180,136,0))}
#hero .names{margin-top:40px;display:flex;align-items:center;gap:clamp(14px,3.5vw,34px);flex-wrap:wrap}
#hero .name{font-family:var(--display);font-weight:700;font-size:clamp(2rem,5.4vw,4.2rem);line-height:1.25}
#hero .x{font-family:var(--display);font-size:clamp(1.5rem,3.8vw,2.9rem);color:var(--gold);transform:translateY(3px)}
#hero .slogan{margin-top:20px;font-family:var(--display);font-weight:500;font-size:clamp(1.2rem,2.6vw,1.8rem);color:var(--gold-soft)}
/* الفهرس */
#toc{margin-top:52px;max-width:640px}
#toc .toc-label{display:flex;align-items:center;gap:14px;font-size:.8125rem;font-weight:700;color:var(--gold-soft)}
#toc .toc-label .rule{height:1px;width:44px;background:linear-gradient(to left,var(--gold),transparent)}
#toc ol{list-style:none;margin-top:18px;border-top:1px solid var(--line-dark)}
#toc a{display:flex;align-items:center;gap:18px;padding:17px 10px;border-bottom:1px solid var(--line-dark);transition:background .4s,padding .4s}
#toc a i{font-style:normal;font-family:var(--display);color:var(--gold);font-size:1rem;min-width:30px}
#toc a b{font-weight:700;font-size:1.0313rem;flex:1}
#toc a svg{width:16px;height:16px;color:var(--gold-soft);opacity:0;transform:translateY(-6px);transition:.4s}
#toc a:hover{background:rgba(179,138,74,.08);padding-inline-start:18px}
#toc a:hover svg{opacity:1;transform:none}
#hero .foot{border-top:1px solid var(--line-dark);padding:16px 0;display:flex;justify-content:space-between;font-size:.75rem;color:rgba(250,248,245,.45)}

/* ==================== الأقسام ==================== */
section.block{padding:104px 0}
section.alt{background:var(--cream2)}
section.block+section.block{border-top:1px solid var(--line)}

/* 01 */
.situation-grid{margin-top:52px;display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.situ-card{background:#fff;box-shadow:var(--shadow);padding:36px 34px;transition:box-shadow .5s,transform .5s}
.situ-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-4px)}
.situ-card .marker{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.situ-card .marker i{font-style:normal;font-family:var(--display);color:var(--gold);font-size:.9375rem}
.situ-card p{color:var(--muted);line-height:2.05;font-size:.9688rem}

/* 02 */
.brand-featured{margin-top:52px;background:var(--ink);color:var(--cream);padding:46px 42px;position:relative;overflow:hidden}
.brand-featured .wm{position:absolute;left:-40px;bottom:-60px;height:280px;opacity:.05;animation:floaty 9s ease-in-out infinite}
.brand-featured .tops{display:flex;align-items:center;gap:18px;position:relative}
.brand-featured h3{font-family:var(--display);font-size:2rem;font-weight:700}
.brand-featured .tag{border:1px solid rgba(207,180,136,.45);color:var(--gold-soft);font-size:.6875rem;font-weight:700;padding:6px 14px;margin-inline-start:auto}
.brand-featured .row{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:28px;position:relative}
.brand-featured .cell b{display:block;color:var(--gold-soft);font-size:.8125rem;margin-bottom:10px}
.brand-featured .cell p{color:rgba(250,248,245,.72);line-height:2;font-size:.9375rem}
.brands-grid{margin-top:22px;display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.brand-card{background:#fff;box-shadow:var(--shadow);padding:38px 36px;display:flex;flex-direction:column;transition:box-shadow .5s,transform .5s}
.brand-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-4px)}
.brand-card .top{display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:22px}
.brand-card h3{font-family:var(--display);font-size:1.5rem;font-weight:700;flex:1}
.brand-card .tag{border:1px solid rgba(179,138,74,.4);color:var(--gold);font-size:.6563rem;font-weight:700;padding:5px 12px;white-space:nowrap}
.brand-card .cell+.cell{margin-top:20px}
.brand-card .cell b{display:block;color:var(--gold);font-size:.8125rem;margin-bottom:8px}
.brand-card .cell p{color:var(--muted);line-height:2;font-size:.9375rem}

/* 03 */
.prio-list{margin-top:44px;display:grid;grid-template-columns:1fr 1fr;column-gap:52px}
.prio{display:flex;gap:18px;align-items:center;padding:20px 8px;border-bottom:1px solid var(--line);transition:background .4s,padding .4s}
.prio:hover{background:rgba(179,138,74,.06);padding-inline-start:16px}
.prio .num{font-style:normal;font-family:var(--display);color:var(--gold);font-size:1rem;min-width:30px}
.prio p{line-height:1.95;font-size:.9688rem;flex:1}

/* 04 */
.services-grid{margin-top:52px;display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.svc{background:#fff;box-shadow:var(--shadow);padding:38px 36px;transition:box-shadow .5s,transform .5s}
.svc:hover{box-shadow:var(--shadow-hover);transform:translateY(-4px)}
.svc .head{display:flex;align-items:center;gap:16px}
.svc h3{font-family:var(--display);font-size:1.35rem;font-weight:700;flex:1}
.svc ul{list-style:none;margin-top:20px;border-top:1px solid var(--line);padding-top:20px}
.svc li{position:relative;padding-inline-start:22px;color:var(--muted);line-height:1.9;font-size:.9375rem;transition:color .3s,padding .3s}
.svc li+li{margin-top:12px}
.svc li::before{content:"";position:absolute;inset-inline-start:2px;top:.72em;width:6px;height:6px;background:var(--gold);transform:rotate(45deg);transition:transform .4s}
.svc li:hover{color:var(--ink);padding-inline-start:28px}
.svc li:hover::before{transform:rotate(225deg)}

/* 05 */
#s5{background:radial-gradient(900px 520px at 50% 0%,rgba(179,138,74,.14),transparent 60%),var(--ink);color:var(--cream);position:relative;overflow:hidden}
#s5 .wm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:400px;opacity:.04;pointer-events:none}
#s5 .sec-head{text-align:center;display:flex;flex-direction:column;align-items:center}
#s5 .eyerow{justify-content:center}
#s5 h2.sec-title::after{inset-inline-start:50%;transform:translateX(50%)}
#s5 .price-card{position:relative;max-width:600px;margin:56px auto 0;border:1px solid rgba(207,180,136,.4);background:rgba(250,248,245,.02);padding:52px 40px;text-align:center;animation:breathe 5.5s ease-in-out infinite}
#s5 .price-card::before{content:"";position:absolute;top:-1px;inset-inline:18%;height:1px;background:linear-gradient(90deg,transparent,var(--gold-soft),transparent);background-size:200% 100%;animation:shimmer 4s linear infinite}
#s5 .kind b{display:block;color:var(--gold-soft);font-size:.8125rem;font-weight:700;margin-bottom:10px}
#s5 .kind span{font-family:var(--display);font-size:1.45rem;font-weight:600}
#s5 .divider{width:64px;height:1px;background:rgba(207,180,136,.5);margin:32px auto}
#s5 .amount-label{color:var(--gold-soft);font-size:.8125rem;font-weight:700}
#s5 .amount{font-family:var(--display);font-weight:700;font-size:clamp(2.8rem,7vw,4.4rem);line-height:1.3;margin-top:6px}
#s5 .amount .riyal{height:.62em;width:auto;display:inline-block;vertical-align:baseline;transform:translateY(.06em);margin-inline-start:.12em;color:rgba(250,248,245,.9)}
#s5 .note{max-width:620px;margin:34px auto 0;color:rgba(250,248,245,.6);line-height:2.1;font-size:.9375rem;text-align:center}

/* التذييل */
footer{background:var(--ink);color:var(--cream);border-top:1px solid var(--line-dark);padding:54px 0 46px}
footer .cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:36px;align-items:start}
footer .eyebrow{color:var(--gold-soft)}
footer .name{font-family:var(--display);font-size:1.3rem;font-weight:700;margin-top:10px}
footer img.plogo{height:54px;width:auto;margin-top:16px}
footer img.mlogo{height:34px;width:auto;margin-top:16px;border-radius:2px;opacity:.92}
footer .end{text-align:left}
footer .end p{font-size:.75rem;color:rgba(250,248,245,.5);margin-top:12px}

/* ==================== الجوال ==================== */
@media(max-width:860px){
  section.block{padding:68px 0}
  .situation-grid,.brands-grid,.services-grid,.prio-list{grid-template-columns:1fr}
  .brand-featured{padding:36px 26px}
  .brand-featured .row{grid-template-columns:1fr}
  .situ-card,.brand-card,.svc{padding:30px 24px}
  #hero .logos{gap:18px}
  #hero .logos img{height:60px}
  #hero .logos .sep{height:46px}
  #toc a{padding:16px 6px}
  #toc a svg{opacity:1;transform:none}
  footer .cols{grid-template-columns:1fr;gap:30px}
  footer .end{text-align:right}
  #spinRose{width:46px;height:46px;bottom:16px;inset-inline-end:16px}
}

/* الطباعة */
@media print{
  html{scroll-behavior:auto}
  #nav,#progress,#spinRose{display:none!important}
  .rv{opacity:1!important;transform:none!important}
  section.block{padding:56px 0;break-inside:avoid-page}
  .situ-card,.brand-card,.svc,.brand-featured,#s5 .price-card{break-inside:avoid;box-shadow:none!important;animation:none!important}
  #hero{min-height:auto;padding:56px 0}
  #hero,#s5,footer,.brand-featured{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<div id="progress"></div>

<header id="nav">
  <div class="bar">
    <a class="brand" href="#hero">
      <img id="navLogo" alt="عبدالرحمن البطي" />
      <span>عبدالرحمن البطي × ميرا</span>
    </a>
    <ul id="navLinks"></ul>
    <button class="print-btn" onclick="window.print()">تصدير PDF</button>
  </div>
</header>

<main id="app"></main>

<button id="spinRose" aria-label="العودة إلى الأعلى" onclick="scrollTo({top:0,behavior:'smooth'})"></button>

<script>
const DATA = {
  hero: {
    nameA: "عبدالرحمن البطي",
    nameB: "ميرا",
    slogan: "شريكك ومعك في كل قرار..",
    cta: "استعراض الملف",
    footRight: "ملف استشاري تسويقي",
    footLeft: "2026",
  },

  s1: {
    id: "s1",
    num: "01",
    title: "تحليل الوضع الحالي",
    paragraphs: [
      "تملك ميرا اليوم مجموعة من العلامات المتنوعة، لكل منها شخصيتها وفرصتها التجارية، إلى جانب ذراع متخصصة في الـ Catering & Events. وهذا التنوع يعتبر نقطة قوة كبيرة، ويعطي ميرا فرصة لبناء حضور أوضح لكل علامة، وتحديد مكانتها ودورها ضمن منظومة ميرا، وتعزيز حضورها في السوق.",
      "المرحلة الحالية مهمة بشكل خاص؛ ميرا حاليًا تعمل على مجموعة من الفرص والتحولات، من إعادة إحياء علامة سهيل، وبناء حضور سهيل كافيه، والاستعداد لمطعم بمفهوم جديد، إلى تنمية ميرا Catering & Events.",
      "ومن هنا تأتي أهمية وجود توجه تسويقي واضح يواكب كل مرحلة، ويساعد على تحديد أين نريد أن تصل كل علامة، وكيف نصل إليها، وما التجربة التي نريد أن يعيشها العميل مع كل علامة وفي كل نقطة تواصل معها.",
      "وتملك ميرا أساسًا قويًا من الخبرة التشغيلية والضيافة؛ إذ يقدم قسم الـ Catering & Events تجارب متنوعة تشمل الفعاليات الخاصة وفعاليات الشركات والجهات الحكومية، إلى جانب تنوع كبير في قوائم وتجارب الضيافة.",
    ],
  },

  s2: {
    id: "s2",
    num: "02",
    title: "تحليل العلامات",
    /* العلامة الأم — بطاقة مميزة داكنة */
    master: {
      name: "ميرا",
      tag: "Master Brand",
      fields: [
        { label: "الدور", text: "Master Brand ومظلة لمجموعة من العلامات المتميزة." },
        { label: "الفرصة", text: "إبراز ميرا بشكل أوضح كمنظومة علامات تجارية متكاملة تمتلك مفاهيم متنوعة، مع توضيح دور ميرا وعلاقتها بالعلامات التابعة لها." },
      ],
    },
    brands: [
      {
        name: "لوسين",
        tag: "علامة راسخة",
        fields: [
          { label: "الوضع", text: "علامة أرمنية راسخة وخبيرة، ولديها قاعدة عملاء ووعي ممتاز في السوق." },
          { label: "الفرصة", text: "الحفاظ على قوة العلامة وتطوير حضورها وتجربتها، والاستفادة من قاعدة عملائها في بناء امتدادات وتجارب جديدة للعلامة." },
        ],
      },
      {
        name: "لوسين تراس",
        tag: "امتداد جديد",
        fields: [
          { label: "الوضع", text: "امتداد جديد لتجربة لوسين، بطابع اجتماعي وترفيهي، مع تقديم الشيشة الفاخرة والأولى من نوعها في السعودية." },
          { label: "الفرصة", text: "تقديمه كتجربة لها شخصيتها وسبب زيارة واضح، مع الحفاظ على ارتباطها بهوية وتجربة Lusin." },
        ],
      },
      {
        name: "سهيل",
        tag: "إعادة إطلاق",
        fields: [
          { label: "الوضع", text: "علامة سعودية ناجحة سابقًا، تعود للسوق بعد فترة توقف، وحاليًا في مرحلة إعادة بناء الهوية وتجربة المنيو." },
          { label: "الفرصة", text: "إعادة تقديم سهيل للسوق كـ Saudi Luxury Premium Dining Concept، مع بناء تموضع وقصة وتجربة تعكس قيمة العلامة وتمنح عودتها حضورًا يليق بها." },
        ],
      },
      {
        name: "سهيل كافيه",
        tag: "مرحلة تجريبية",
        fields: [
          { label: "الوضع", text: "يعمل حاليًا بشكل تجريبي ولديه عملاء، لكن حضوره ووعي السوق به ما زالا في مرحلة مبكرة." },
          { label: "الفرصة", text: "الاستفادة من المرحلة التجريبية لبناء حضور تدريجي ومدروس، وصولًا إلى إطلاق رسمي يساعد على رفع الوعي والطلب حول علامة سهيل كافيه." },
        ],
      },
      {
        name: "Catering & Events",

  <div class="wrap">
    <div class="sec-head rv">
      ${eyerow(D.s5.num, D.s5.title)}
      <h2 class="sec-title">${D.s5.title}</h2>
    </div>
    <div class="price-card rv">
      <div class="kind"><b>${D.s5.kindLabel}</b><span dir="ltr">${D.s5.kind}</span></div>
      <div class="divider"></div>
      <div class="amount-label">${D.s5.amountLabel}</div>
      <div class="amount"><span dir="ltr">${D.s5.amountValue.toLocaleString("en-US")}</span> <svg class="riyal" viewBox="0 0 1124.14 1256.39" fill="currentColor" aria-label="ريال سعودي" role="img"><path d="M699.62,1113.02h0c-20.06,44.48-33.32,92.75-38.4,143.37l424.51-90.24c20.06-44.47,33.31-92.75,38.4-143.37l-424.51,90.24Z"/><path d="M1085.73,895.8c20.06-44.47,33.32-92.75,38.4-143.37l-330.68,70.33v-135.2l292.27-62.11c20.06-44.47,33.32-92.75,38.4-143.37l-330.68,70.27V66.13c-50.67,28.45-95.67,66.32-132.25,110.99v403.35l-132.25,28.11V0c-50.67,28.44-95.67,66.32-132.25,110.99v525.69l-295.91,62.88c-20.06,44.47-33.33,92.75-38.42,143.37l334.33-71.05v170.26l-358.3,76.14c-20.06,44.47-33.32,92.75-38.4,143.37l375.04-79.7c30.53-6.35,56.77-24.4,73.83-49.24l68.78-101.97v-.02c7.14-10.55,11.3-23.27,11.3-36.97v-149.98l132.25-28.11v270.4l424.53-90.28Z"/></svg></div>
    </div>
    <p class="note rv">${D.s5.note}</p>
  </div>
</section>

<!-- ================= التذييل ================= -->
<footer>
  <div class="wrap cols">
    <div class="rv">
      <span class="eyebrow">${D.footer.forLabel}</span>
      <div class="name">${D.footer.forName}</div>
      <img class="mlogo" src="${LOGO_MIRA}" alt="ميرا"/>
    </div>
    <div class="rv" style="transition-delay:.1s">
      <span class="eyebrow">${D.footer.byLabel}</span>
      <div class="name">${D.footer.byName}</div>
      <img class="plogo" src="${LOGO_WHITE}" alt="${D.footer.byName}"/>
    </div>
    <div class="end rv" style="transition-delay:.2s">
      ${rosette(26, 1.1)}
      <p>${D.footer.confidential}</p>
      <p><span dir="ltr">${D.footer.year}</span></p>
    </div>
  </div>
</footer>
`;

/* شعار شريط التنقل + الروابط */
document.getElementById("navLogo").src = LOGO_WHITE;
document.getElementById("navLinks").innerHTML = sections
  .map(s => `<li><a href="#${s.id}">${s.num} — ${s.title}</a></li>`).join("");
document.getElementById("spinRose").innerHTML = rosette(26, 1.4);

/* الظهور عند التمرير */
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const io = new IntersectionObserver(
  es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }),
  { rootMargin: "-8% 0px" }
);
document.querySelectorAll(".rv").forEach(el => (reduce ? el.classList.add("in") : io.observe(el)));

/* شريط التقدم + وردة تدور مع التمرير + باراللاكس */
const bar = document.getElementById("progress");
const rose = document.getElementById("spinRose");
const roseSvg = () => rose.querySelector("svg");
const plx = [...document.querySelectorAll("[data-parallax]")];
addEventListener("scroll", () => {
  const h = document.documentElement;
  const p = h.scrollTop / (h.scrollHeight - h.clientHeight);
  bar.style.width = p * 100 + "%";
  rose.classList.toggle("show", h.scrollTop > 500);
  if (!reduce) {
    roseSvg().style.transform = `rotate(${p * 720}deg)`;
    plx.forEach(el => {
      const f = parseFloat(el.dataset.parallax);
      el.style.transform = `translateY(${h.scrollTop * f}px) rotate(${h.scrollTop * f * 0.15}deg)`;
    });
  }
}, { passive: true });

/* تفعيل رابط القسم الحالي */
const navAs = [...document.querySelectorAll("#navLinks a")];
const spy = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting)
      navAs.forEach(a => a.classList.toggle("active", a.getAttribute("href") === "#" + e.target.id));
  });
}, { rootMargin: "-45% 0px -45% 0px" });
sections.forEach(s => spy.observe(document.getElementById(s.id)));
</script>
</body>
</html>
